<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Rômulo — Organização Pessoal</title>
    <meta name="description" content="App pessoal de agenda, metas, investimentos, treino, dieta e finanças." />

    <!-- PWA / iOS "Adicionar à Tela de Início" — o ?v= existe só pra forçar o Safari a
         buscar o arquivo de novo quando a logo trocar (o iOS guarda esse ícone específico
         de forma bem mais teimosa que o resto do site; sem isso ele pode continuar
         mostrando uma versão antiga mesmo com o arquivo já atualizado no servidor).
         Ao trocar a logo de novo no futuro, incremente esse número. -->
    <link rel="icon" type="image/png" href="icons/favicon-32.png?v=3" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rômulo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060606" />

    <!-- Aplica o tema salvo antes da primeira renderização, evitando flash de tema errado -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Altura real da tela via JS, não via unidade CSS (100vh/100dvh) — no modo
         "Adicionar à Tela de Início" do iOS, o dvh às vezes calcula uma altura menor que
         a tela de verdade, sobrando uma faixa preta embaixo da barra de navegação.
         window.innerHeight é confiável mesmo nesse modo. Atualiza em resize/orientação
         (ex: girar o aparelho) pra nunca ficar desatualizado. -->
    <script>
      (function () {
        function setAppHeight() {
          document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
