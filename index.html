<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Rômulo — Organização Pessoal</title>
    <meta name="description" content="App pessoal de agenda, metas, investimentos, treino, dieta e finanças." />

    <!-- PWA / iOS "Adicionar à Tela de Início" -->
    <link rel="icon" type="image/png" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rômulo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#060606" />

    <!-- Aplica o tema salvo antes da primeira renderização, evitando flash de tema errado -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
